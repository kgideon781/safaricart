services:
  postgres:
    image: postgres:17-alpine
    container_name: safaricart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safaricart
      POSTGRES_PASSWORD: safaricart
      POSTGRES_DB: safaricart
    ports:
      - "5432:5432"
    volumes:
      - safaricart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safaricart -d safaricart"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: safaricart-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@safaricart.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - safaricart-pgadmin-data:/var/lib/pgadmin

volumes:
  safaricart-postgres-data:
  safaricart-pgadmin-data:
